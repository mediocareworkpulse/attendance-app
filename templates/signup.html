<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – {{ company }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body.login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0b2b4a, #134b6e); }
        .login-card { background: #fff; border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 440px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <h1 style="font-size:22px; color:#0b2b4a;">{{ company }}</h1>
        <div class="brand-sub" style="font-size:12px; color:#5c6b7a; margin-bottom:20px;">Create your account</div>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="full_name" placeholder="Full Name" required style="margin-bottom:10px;">
            <input type="text" name="phone" placeholder="Phone Number" required style="margin-bottom:10px;">
            <input type="password" name="password" placeholder="Password" required style="margin-bottom:10px;">
            <select name="department" style="margin-bottom:10px;">
                {% for d in departments %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
            </select>
            <select name="branch" style="margin-bottom:10px;">
                {% for b in branches %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
            </select>
            <select name="role" style="margin-bottom:10px;">
                {% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
            </select>
            <div style="display:flex; gap:10px; margin-bottom:16px;">
                <input type="time" name="shift_start" value="08:00" style="flex:1;">
                <input type="time" name="shift_end" value="17:00" style="flex:1;">
            </div>
            <button type="submit" class="btn" style="width:100%; background: linear-gradient(135deg, #0b2b4a, #134b6e);">Sign Up</button>
        </form>
        <p style="margin-top:16px; font-size:13px;">Already have an account? <a href="/login" style="color:#0b2b4a;">Log in</a></p>
    </div>
</body>
</html>
