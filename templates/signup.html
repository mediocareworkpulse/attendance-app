<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – Mediocare Pharmaceutical Ltd</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body.login-page {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b2b4a 0%, #0f3460 60%, #134b6e 100%);
            position: relative;
            overflow-y: auto;
            padding: 20px;
        }
        body.login-page::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 50%),
                              radial-gradient(circle at 20% 80%, rgba(212,168,67,0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        .signup-card {
            background: #fff;
            border-radius: 24px;
            padding: 36px 28px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.35);
            position: relative;
            z-index: 2;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        .signup-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .signup-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(11,43,74,0.3);
        }
        .signup-header h2 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .signup-header .company-name { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
        .signup-header .tagline { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .form-row .form-group { flex: 1; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 10px; font-weight: 700; color: #4a5568; text-transform: uppercase; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
            border-radius: var(--radius); font-size: 13px; background: #fafbfc;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(11,43,74,0.08); }

        .btn-signup {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff; border: none; border-radius: var(--radius);
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.3s; margin-top: 4px;
            box-shadow: 0 6px 18px rgba(11,43,74,0.3);
        }
        .btn-signup:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(11,43,74,0.4); }

        .signup-footer { margin-top: 18px; text-align: center; font-size: 13px; color: var(--text-secondary); }
        .signup-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .signup-footer a:hover { text-decoration: underline; }

        .alert { margin-bottom: 16px; }
    </style>
</head>
<body class="login-page">

    <div class="signup-card">
        <div class="signup-header">
            <div class="signup-logo">💊</div>
            <h2>Mediocare Pharmaceutical Ltd</h2>
            <div class="company-name">Staff Registration</div>
            <div class="tagline">Join our team today</div>
        </div>

        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}

        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="full_name" placeholder="e.g. Jane Muthoni" required>
                </div>
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="text" name="phone" placeholder="07XX XXX XXX" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" placeholder="Choose a password" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role">
                        {% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <select name="department">
                        {% for d in departments %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <select name="branch">
                        {% for b in branches %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Shift Start</label>
                    <input type="time" name="shift_start" value="08:00">
                </div>
                <div class="form-group">
                    <label>Shift End</label>
                    <input type="time" name="shift_end" value="17:00">
                </div>
            </div>
            <button type="submit" class="btn-signup">Create Account</button>
        </form>

        <div class="signup-footer">
            Already registered? <a href="/login">Sign in here</a>
        </div>
    </div>

</body>
</html>
