{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Branches</h1>
<p class="page-subtitle">{{ company }}</p>

<!-- Add Branch -->
<div class="form-card">
    <h2 style="font-size:16px; margin-bottom:12px;">➕ Add Branch</h2>
    <form method="POST" action="/branches/add" class="form-grid">
        <div><input type="text" name="name" placeholder="Branch Name" required></div>
        <div><input type="time" name="shift_start" value="08:00"></div>
        <div><input type="time" name="shift_end" value="17:00"></div>
        <div><button type="submit" class="btn">Add</button></div>
    </form>
</div>

<!-- Branch List -->
<div class="table-container">
    <table>
        <thead><tr><th>Name</th><th>Shift Start</th><th>Shift End</th><th>Actions</th></tr></thead>
        <tbody>
        {% for b in branches %}
        <tr>
            <td class="td-name">{{ b.name }}</td>
            <td>{{ b.shift_start or '08:00' }}</td>
            <td>{{ b.shift_end or '17:00' }}</td>
            <td>
                <form method="POST" action="/branches/delete/{{ b.id }}" style="display:inline">
                    <button class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
