{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Sales Targets</h1>
<p class="page-subtitle">{{ company }}</p>

<div class="form-card">
    <h2 style="font-size:16px; margin-bottom:12px;">🎯 Set Monthly Target</h2>
    <form method="POST" class="form-grid">
        <div>
            <select name="employee_name">
                {% for e in employees %}<option value="{{ e.full_name }}">{{ e.full_name }}</option>{% endfor %}
            </select>
        </div>
        <div><input type="month" name="month" value="{{ today[:7] }}"></div>
        <div><input type="number" step="0.01" name="amount" placeholder="Target amount"></div>
        <div><button type="submit" class="btn">Set Target</button></div>
    </form>
</div>

<h2 style="font-size:16px; margin-top:24px; margin-bottom:12px;">📊 Current Targets</h2>
<div class="table-container">
    <table>
        <thead><tr><th>Employee</th><th>Month</th><th>Target (Ksh)</th><th>Set By</th></tr></thead>
        <tbody>
        {% for t in targets %}
        <tr>
            <td class="td-name">{{ t.full_name }}</td>
            <td>{{ t.month }}</td>
            <td>{{ t.target_amount }}</td>
            <td>{{ t.set_by }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
