<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Leave Request – {{ company }}</title>
    <style>
        body { font-family: 'Inter', sans-serif; padding: 40px; max-width: 600px; margin: auto; color: #1a1a2e; }
        h2 { color: #0b2b4a; } table { width:100%; border-collapse: collapse; margin-top:20px; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>{{ company }} – Leave Request</h2>
    <table>
        <tr><th>Employee</th><td>{{ lv.full_name }}</td></tr>
        <tr><th>Leave Type</th><td>{{ lv.leave_type }}</td></tr>
        <tr><th>Dates</th><td>{{ lv.leave_start }} to {{ lv.leave_end }} ({{ lv.total_days }} days)</td></tr>
        <tr><th>Status</th><td>{{ lv.status }}</td></tr>
        <tr><th>Approved By</th><td>{{ lv.approved_by or 'Pending' }}</td></tr>
    </table>
</body>
</html>
