{% extends "base.html" %}
{% block content %}
<div class="marketer-places">
    <h1 class="page-title">My Assigned Places</h1>
    <p class="page-subtitle">{{ company }}</p>

    {% if places %}
    <div class="place-cards">
        {% for p in places %}
        <div class="place-card">
            <h3>{{ p.place_name }}</h3>
            <p>Assigned: {{ p.date_assigned }}</p>
            <!-- You can add more fields if present in the database, e.g., location, phone -->
            <a href="/marketer/report?place={{ p.place_name }}" class="btn btn-sm">Start Visit</a>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="alert alert-info">No assigned places yet.</div>
    {% endif %}
</div>
{% endblock %}
