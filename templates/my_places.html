{% extends "base.html" %}
{% block content %}
<h1 class="page-title">My Assigned Places</h1>
<p class="page-subtitle">{{ company }}</p>

<div class="table-container">
    <table>
        <thead><tr><th>Place</th><th>Date Assigned</th></tr></thead>
        <tbody>
        {% for p in places %}
        <tr>
            <td class="td-name">{{ p.place_name }}</td>
            <td>{{ p.date_assigned }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
