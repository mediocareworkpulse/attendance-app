<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – {{ company }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body.login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0b2b4a, #134b6e); }
        .login-card { background: #fff; border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; }
        .login-card h1 { font-size: 22px; margin-bottom: 6px; color: #0b2b4a; }
        .login-card .brand-sub { font-size: 12px; color: #5c6b7a; margin-bottom: 24px; }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <h1>{{ company }}</h1>
        <div class="brand-sub">Attendance System</div>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="full_name" placeholder="Full Name" required style="margin-bottom:12px;">
            <input type="password" name="password" placeholder="Password" required style="margin-bottom:20px;">
            <button type="submit" class="btn" style="width:100%; background: linear-gradient(135deg, #0b2b4a, #134b6e);">Log In</button>
        </form>
        <p style="margin-top:16px; font-size:13px;">Don't have an account? <a href="/signup" style="color:#0b2b4a; font-weight:600;">Sign up</a></p>
    </div>
</body>
</html>
