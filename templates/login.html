<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – {{ company }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #020617 0%, #0b2b4a 60%);
            padding: 20px;
        }

        /* Glowing container */
        .wrapper {
            position: relative;
            width: 750px;
            min-height: 480px;
            background: #0b1329;
            border: 2px solid #d4a843;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(212, 168, 67, 0.4), 0 0 15px rgba(212, 168, 67, 0.2) inset;
            display: flex;
            flex-wrap: wrap;
        }

        /* Diagonal overlay with gold gradient */
        .wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            right: -100px;
            width: 450px;
            height: 100%;
            background: linear-gradient(135deg, #0b2b4a 0%, #d4a843 100%);
            transform: skewX(-18deg);
            z-index: 1;
        }

        /* Left side – login form */
        .form-box {
            position: relative;
            width: 50%;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .form-box .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .form-box .brand-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #d4a843, #b38b2c);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            color: #0b1329;
        }
        .form-box .brand-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }
        .form-box .brand-sub {
            font-size: 10px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-box h2 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .form-box .subtitle {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-bottom: 22px;
        }

        .input-box {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
            border-bottom: 2px solid #334155;
            transition: border-color 0.3s;
        }
        .input-box:focus-within {
            border-bottom-color: #d4a843;
        }

        .input-box input {
            width: 100%;
            height: 42px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.9rem;
            color: #fff;
            padding-right: 30px;
            padding-left: 2px;
        }
        .input-box input::placeholder {
            color: #64748b;
        }
        .input-box i {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.85rem;
            transition: color 0.3s;
        }
        .input-box:focus-within i {
            color: #d4a843;
        }

        .btn {
            width: 100%;
            height: 42px;
            background: linear-gradient(90deg, #d4a843, #b38b2c);
            border: none;
            outline: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #0b1329;
            font-weight: 700;
            margin-top: 12px;
            box-shadow: 0 0 15px rgba(212, 168, 67, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 0.3px;
        }
        .btn:hover {
            box-shadow: 0 0 22px rgba(212, 168, 67, 0.7);
            transform: translateY(-2px);
        }

        .register-link {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 18px;
        }
        .register-link a {
            color: #d4a843;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }

        /* Right side – welcome text */
        .info-text {
            position: relative;
            width: 50%;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            text-align: right;
            z-index: 2;
            color: #ffffff;
        }
        .info-text h2 {
            font-size: 2.4rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }
        .info-text p {
            font-size: 0.85rem;
            color: #e2e8f0;
            line-height: 1.6;
            max-width: 240px;
        }
        .info-text .logo-watermark {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        /* Error message */
        .alert-error {
            background: rgba(220, 38, 38, 0.15);
            border-left: 4px solid #ef4444;
            color: #fecaca;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Responsive */
        @media (max-width: 750px) {
            .wrapper {
                width: 100%;
                flex-direction: column;
                min-height: auto;
            }
            .wrapper::before {
                display: none;
            }
            .form-box, .info-text {
                width: 100%;
                padding: 30px 24px;
                text-align: center;
                align-items: center;
            }
            .info-text {
                background: linear-gradient(135deg, #0b2b4a, #d4a843);
                text-align: center;
                align-items: center;
                padding-top: 10px;
                padding-bottom: 30px;
            }
            .info-text h2 {
                font-size: 1.8rem;
            }
            .info-text p {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Login Form -->
        <div class="form-box">
            <div class="brand">
                <div class="brand-icon">💊</div>
                <div>
                    <div class="brand-name">{{ company }}</div>
                    <div class="brand-sub">Attendance System</div>
                </div>
            </div>
            <h2>Welcome back</h2>
            <div class="subtitle">Sign in to your account</div>

            {% if error %}
            <div class="alert-error">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="input-box">
                    <input type="text" name="full_name" placeholder="Full name" required autocomplete="name">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>

            <div class="register-link">
                Don't have an account? <a href="/signup">Create one</a>
            </div>
        </div>

        <!-- Welcome Text -->
        <div class="info-text">
            <div class="logo-watermark">💊</div>
            <h2>Mediocare<br>Pharmaceutical</h2>
            <p>Secure attendance management for every employee. Your gateway to professional workforce tracking.</p>
        </div>
    </div>

</body>
</html>
