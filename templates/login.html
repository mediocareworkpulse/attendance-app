<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Mediocare Pharmaceutical Ltd</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body.login-page {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b2b4a 0%, #0f3460 60%, #134b6e 100%);
            position: relative;
            overflow: hidden;
        }
        /* subtle pattern overlay */
        body.login-page::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(212,168,67,0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        .login-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.35);
            position: relative;
            z-index: 2;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(11,43,74,0.3);
        }
        .login-header h1 {
            font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 2px;
            letter-spacing: -0.3px;
        }
        .login-header .company-full {
            font-size: 13px; color: var(--text-secondary); font-weight: 500;
            margin-bottom: 4px;
        }
        .login-header .brand-tagline {
            font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 700; color: #4a5568; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            transition: 0.2s;
            background: #fafbfc;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(11,43,74,0.08); }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 18px rgba(11,43,74,0.3);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(11,43,74,0.4); }

        .login-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .login-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }

        .alert { margin-bottom: 18px; }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">💊</div>
            <h1>Mediocare Pharmaceutical Ltd</h1>
            <div class="company-full">Attendance Management System</div>
            <div class="brand-tagline">Secure • Reliable • Professional</div>
        </div>

        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="Enter your full name" required autocomplete="name">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="login-footer">
            Don't have an account? <a href="/signup">Create one here</a>
        </div>
    </div>

</body>
</html>
