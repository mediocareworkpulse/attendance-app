{% extends "base.html" %}
{% block content %}
<div class="marketer-report-form">
    <h1 class="page-title">Customer Report</h1>
    <p class="page-subtitle">{{ today }}</p>

    <form method="POST" action="/marketer/report" id="reportForm">
        <!-- Customer section -->
        <div class="card">
            <h3>Customer</h3>
            <label>Customer Name *</label>
            <input type="text" name="customer_name" required>
            <label>Phone</label>
            <input type="text" name="customer_phone">
            <label>Contact Person</label>
            <input type="text" name="contact_person">
            <label>Location</label>
            <input type="text" name="location">
        </div>

        <!-- Visit section -->
        <div class="card">
            <h3>Visit</h3>
            <label>Purpose of Visit</label>
            <input type="text" name="purpose">
            <label>Notes</label>
            <textarea name="details" rows="3"></textarea>
        </div>

        <!-- Opportunity section -->
        <div class="card">
            <h3>Opportunity</h3>
            <label>Expected Order Date</label>
            <input type="date" name="expected_order_date">
        </div>

        <!-- Expense section -->
        <div class="card">
            <h3>Expense</h3>
            <label>Expense Amount</label>
            <input type="number" step="0.01" name="expenses" value="0">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Submit Report</button>
    </form>
</div>
{% endblock %}
